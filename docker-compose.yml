services:
  backend:
    build: ./backend
    container_name: cubix-json-backend
    ports:
      - "3000:3000"
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: cubix-angular-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

  optional-app:
    build:
      context: ./optional-app
      dockerfile: Dockerfile
      args:
        - VERSION=2.5.0-cubix-optional
    container_name: cubix-optional-node
    ports:
      - "4000:4000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge